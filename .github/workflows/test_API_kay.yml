name: Test Filstar API Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Filstar API connection
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.FILSTAR_API_TOKEN }}" \
            https://filstar.com/api)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Token works!"
          else
            echo "❌ Token failed with status: $STATUS"
          fi
